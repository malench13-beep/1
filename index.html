function checkout(){pop(modalHead('Оформлення DEMO')+'<p class="muted">Використовуйте лише вигадані дані: заявка нікуди не надсилається.</p><form id="checkout"><div class="field"><label>Ім’я (тестове)</label><input required name="name"></div><div class="field"><label>Телефон (тестовий)</label><input required name="phone"></div><div class="field"><label>Місто</label><input required name="city"></div><div class="field"><label>Доставка</label><select><option>Нова пошта</option><option>Укрпошта</option></select></div><div class="field"><label>Оплата</label><select><option>Накладений платіж (DEMO)</option></select></div><button class="btn">Перевірити форму</button></form>')}
var tabs={main:'Основне',desc:'Опис',price:'Ціни',media:'Фото',seo:'SEO'};
var fields={main:[['title','Назва','text'],['brand','Бренд','text'],['category','Категорія','category'],['published','Публікація','checkbox']],desc:[['short','Короткий опис','textarea'],['description','Опис','textarea'],['features','Характеристики','textarea']],price:[['price','Ціна (демо)','number'],['stock','Залишок (демо)','number']],media:[['alt','Alt для фото','text']],seo:[['seo_title','SEO title','text'],['seo_description','SEO description','textarea']]};
function editProduct(sku){selected=sku;var p=ShopApi.getProduct(sku);if(!p)return;pop(modalHead('Редактор · SKU '+esc(sku))+'<div class="tabs">'+Object.entries(tabs).map(function(v){return '<button data-tab="'+v[0]+'" class="'+(editTab===v[0]?'active':'')+'">'+v[1]+'</button>'}).join('')+'</div><form id="editor" data-sku="'+esc(sku)+'"><div class="edit-scroll">'+fields[editTab].map(function(f){var k=f[0],label=f[1],kind=f[2];var input=kind==='textarea'?'<textarea name="'+k+'">'+esc(p[k])+'</textarea>':kind==='checkbox'?'<label><input name="'+k+'" type="checkbox" '+(p[k]?'checked':'')+'> Показувати в каталозі</label>':kind==='category'?'<select name="category">'+state.categories.map(function(c){return '<option value="'+c.id+'" '+(p.category===c.id?'selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select>':'<input name="'+k+'" type="'+kind+'" '+(kind==='number'?'min="0" max="999999"':'maxlength="3000"')+' value="'+esc(p[k])+'">';return '<div class="field"><label>'+label+'</label>'+input+'</div>'}).join('')+'</div>'+(editTab==='media'?'<p class="muted">Справжня загрузка фотографій потребує API/R2; зараз редагується лише alt.</p>':'')+'<button class="btn">Зберегти DEMO</button></form>')}
function editCategory(id){selected=id;var c=state.categories[id];pop(modalHead('Категорія')+'<form id="category-form"><div class="field"><label>Назва</label><input name="name" value="'+esc(c.name)+'" required></div><div class="field"><label>Іконка</label><input name="icon" value="'+esc(c.icon)+'" maxlength="10"></div><div class="field"><label>Видима</label><select name="active"><option value="true" '+(c.active?'selected':'')+'>Так</option><option value="false" '+(c.active?'':'selected')+'>Ні</option></select></div><button class="btn">Зберегти DEMO</button></form>')}
function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var d=b.dataset;
if(d.view){view=d.view;query='';close();history.replaceState(null,'',view==='admin'?'?view=admin':'?demo=1');render();return}
if(d.section){section=d.section;query='';render();return}
if(d.category!==undefined){chosen=chosen===Number(d.category)?-1:Number(d.category);render();return}
if(d.detail){productDetail(d.detail);return}
if(d.buy){cart[d.buy]=(cart[d.buy]||0)+1;toast('Додано в DEMO-кошик');render();return}
if(d.edit){editTab='main';editProduct(d.edit);return}
if(d.catEdit){editCategory(Number(d.catEdit));return}
if(d.tab){var sku=selected;editTab=d.tab;editProduct(sku);return}
if(d.minus){cart[d.minus]=Math.max(0,(cart[d.minus]||0)-1);if(!cart[d.minus])delete cart[d.minus];cartPanel();return}
if(d.plus){cart[d.plus]=(cart[d.plus]||0)+1;cartPanel();return}
if(d.act==='close'){close();return}
if(d.act==='cart'){cartPanel();return}
if(d.act==='checkout'){checkout();return}
if(d.act==='scroll'){document.getElementById('catalog').scrollIntoView({behavior:'smooth'});return}
if(d.act==='all'){chosen=-1;query='';render();return}
if(d.act==='reset'){if(confirm('Скинути усі зміни DEMO?')){localStorage.removeItem(key);location.reload()}return}
if(d.act==='export'){var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='1cina-demo.json';a.click();setTimeout(function(){URL.revokeObjectURL(u)},1500);return}
});
document.addEventListener('input',function(e){if(e.target.id==='find'){query=e.target.value;var pos=e.target.selectionStart;render();var el=document.getElementById('find');if(el){el.focus();el.setSelectionRange(pos,pos)}}});
document.addEventListener('change',function(e){if(e.target.id==='sort'){sort=e.target.value;render()}});
document.addEventListener('submit',function(e){var f=e.target;e.preventDefault();if(f.id==='checkout'){close();cart={};render();toast('DEMO перевірено – замовлення не створено');return}
if(f.id==='settings'){ShopApi.saveSettings(Object.fromEntries(new FormData(f)));render();toast('Налаштування DEMO збережені');return}
if(f.id==='category-form'){var data=Object.fromEntries(new FormData(f));data.active=data.active==='true';ShopApi.setCategory(selected,data);close();render();toast('Категорія DEMO збережена');return}
if(f.id==='editor'){var data=Object.fromEntries(new FormData(f));if(editTab==='main')data.published=!!f.querySelector('[name="published"]')?.checked;if('price'in data)data.price=Math.max(0,Number(data.price)||0);if('stock'in data)data.stock=Math.max(0,Number(data.stock)||0);if('category'in data)data.category=Number(data.category);ShopApi.patchProduct(f.dataset.sku,data);close();render();toast('Товар DEMO збережено')}}
);
document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
render();
</script></body></html>
